name: "dev-strateg-ua"
services:
  dev-strateg-php-fpm:
    build:
      context: $PWD
      dockerfile: .docker/prod/php/Dockerfile
      target: production
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-php-fpm:1.1-slim
    container_name: dev-strateg-php-fpm
    env_file:
      - ../../.docker/prod/env/.env
      - ../../.docker/prod/env/.env.mariadb
    volumes:
      - ../../httpdocs:/var/www/html
      - ../../storage:/var/www/storage
      - ../../.docker/dev/env/:/var/www/html/external-env:ro
      - ../../../strateg-images/image/1Cproducts:/var/www/html/image/catalog/1Cproducts
      - ../../../strateg-images/image/cache:/var/www/html/image/cache
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ../../.docker/dev/php/my-www.conf:/usr/local/etc/php-fpm.d/my-www.conf:ro
      - ../../.docker/prod/php/php.ini:/usr/local/etc/php/php.ini:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    tmpfs:
      - /tmp # PHP temporary files (file_put_contents, tmpfile())
      - /var/run # PHP-FPM sockets and pid files
    depends_on:
      - dev-strateg-mariadb
    networks:
      - dev-strateg-net
      - buggregator-net

  dev-strateg-cron:
    build:
      context: $PWD
      dockerfile: .docker/prod/cron/Dockerfile
      target: production
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-cron:1.0-slim
    container_name: dev-strateg-cron
    restart: unless-stopped
    env_file:
      - ../../.docker/prod/env/.env
      - ../../.docker/prod/env/.env.mariadb
    volumes:
      - ../../httpdocs:/var/www/html:ro
      - ../../storage:/var/www/storage:ro
      - ../../.docker/dev/env/:/var/www/html/external-env:ro
      - ../../../strateg-images/image/1Cproducts:/var/www/html/image/catalog/1Cproducts
      - ../../../strateg-images/image/cache:/var/www/html/image/cache
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ../../.docker/dev/php/my-www.conf:/usr/local/etc/php-fpm.d/my-www.conf:ro
      - ../../.docker/prod/cron/crontabs:/etc/crontabs
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - dev-strateg-php-fpm
      - dev-strateg-mariadb
    networks:
      - dev-strateg-net
      - buggregator-net

  dev-strateg-nginx:
    build:
      context: $PWD
      dockerfile: .docker/prod/nginx/Dockerfile
      target: production
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-nginx:1.0-slim
    container_name: dev-strateg-nginx
    env_file:
      - ../../.docker/prod/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev-strateg-nginx.rule=Host(`dev.strateg.ua`)"
      - "traefik.http.routers.dev-strateg-nginx.entrypoints=web"
      - "traefik.http.services.dev-strateg-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../httpdocs:/var/www/html:ro
      - ../../storage:/var/www/storage:ro
      - ../../.docker/prod/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../../strateg-images/image/1Cproducts:/var/www/html/image/catalog/1Cproducts:ro
      - ../../../strateg-images/image/cache:/var/www/html/image/cache:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    tmpfs:
      - /tmp                    # Nginx temporary files
      - /var/cache/nginx        # Nginx cache (fastcgi_cache, proxy_cache)
    depends_on:
      - dev-strateg-php-fpm
    networks:
      - traefik-network
      - dev-strateg-net

  dev-strateg-mariadb:
    build:
      context: $PWD
      dockerfile: .docker/prod/mariadb/Dockerfile
      target: production
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-mariadb:1.0
    container_name: dev-strateg-mariadb
    ports:
      - "3336:3306"
    restart: no
    env_file:
      - ../../.docker/prod/env/.env
      - ../../.docker/prod/env/.env.mariadb
    volumes:
      - ../../.db:/var/lib/mysql
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - dev-strateg-net

  dev-strateg-memcached:
    build:
      context: $PWD
      dockerfile: .docker/prod/memcached/Dockerfile
      target: production
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-syvak-memcached:1.0
    container_name: dev-strateg-memcached
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    tmpfs:
      - /tmp:size=10M
    ports:
      - "00258:11211"
    command:
      - --conn-limit=1024
      - --memory-limit=256
      - --threads=4
    networks:
      - dev-strateg-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  dev-strateg-net:
    name: dev-strateg-net
    driver: bridge
    external: true
  buggregator-net:
    name: buggregator-net
    driver: bridge
    external: true