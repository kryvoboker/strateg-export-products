name: "dev-strateg-export-products"
services:
  dev-strateg-export-products-php-fpm:
    build:
      context: $PWD
      dockerfile: .docker/dev/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-php-fpm:1.0
    container_name: dev-strateg-export-products-php-fpm
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../httpdocs/app:/var/www/app
      - ../../httpdocs/httpdocs:/var/www/html
      - ../../httpdocs/storage:/var/www/storage
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    tmpfs:
      - /tmp # PHP temporary files (file_put_contents, tmpfile())
      - /var/run # PHP-FPM sockets and pid files
    depends_on:
      - dev-strateg-export-products-postgresql
    networks:
      - dev-strateg-export-products-net
      - buggregator-net
      - traefik-network

  dev-strateg-export-products-cron:
    build:
      context: $PWD
      dockerfile: .docker/dev/cron/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-cron:1.0
    container_name: dev-strateg-export-products-cron
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../httpdocs/app:/var/www/app:ro
      - ../../httpdocs/httpdocs:/var/www/html:ro
      - ../../httpdocs/storage:/var/www/storage:ro
      - ../../.docker/dev/cron/crontabs:/etc/crontabs
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - dev-strateg-export-products-php-fpm
      - dev-strateg-export-products-postgresql
    networks:
      - dev-strateg-export-products-net
      - buggregator-net

  dev-strateg-export-products-nginx:
    build:
      context: $PWD
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-nginx:1.0
    container_name: dev-strateg-export-products-nginx
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev-strateg-export-products-nginx.rule=Host(`dev.strateg-export-products.com`)"
      - "traefik.http.routers.dev-strateg-export-products-nginx.entrypoints=web"
      - "traefik.http.services.dev-strateg-export-products-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../httpdocs/app:/var/www/app:ro
      - ../../httpdocs/httpdocs:/var/www/html:ro
      - ../../httpdocs/storage:/var/www/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    tmpfs:
      - /tmp                    # Nginx temporary files
    depends_on:
      - dev-strateg-export-products-php-fpm
    networks:
      - traefik-network
      - dev-strateg-export-products-net

