  dev-strateg-export-products-postgresql:
    build:
      context: $PWD
      dockerfile: .docker/dev/postgresql/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-postgresql:1.0
    container_name: dev-strateg-export-products-postgresql
    ports:
      - "3343:5432"
    restart: no
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../.db:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - dev-strateg-export-products-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  dev-strateg-export-products-net:
    name: dev-strateg-export-products-net
    driver: bridge
    external: true
  buggregator-net:
    name: buggregator-net
    driver: bridge
    external: true