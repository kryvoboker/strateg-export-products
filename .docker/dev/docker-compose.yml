name: "dev-strateg-export-products"

services:
  dev-strateg-export-products-php-fpm:
    build:
      context: $PWD
      dockerfile: .docker/dev/php/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-php-fpm:1.0
    container_name: dev-strateg-export-products-php-fpm
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../app-code/app:/var/webroot/sites/export-products.strateg.ua/app
      - ../../app-code/httpdocs:/var/webroot/sites/export-products.strateg.ua/httpdocs
      - ../../app-code/storage:/var/webroot/sites/export-products.strateg.ua/storage
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    tmpfs:
      - /tmp # PHP temporary files (file_put_contents, tmpfile())
      - /var/run # PHP-FPM sockets and pid files
    depends_on:
      dev-strateg-export-products-postgresql:
        condition: service_healthy
    networks:
      - dev-strateg-export-products-net
      - buggregator-net
      - traefik-network

  dev-strateg-export-products-cron:
    build:
      context: $PWD
      dockerfile: .docker/dev/cron/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-cron:1.0-alpine
    container_name: dev-strateg-export-products-cron
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../app-code/app:/var/webroot/sites/export-products.strateg.ua/app:ro
      - ../../app-code/httpdocs:/var/webroot/sites/export-products.strateg.ua/httpdocs:ro
      - ../../app-code/storage:/var/webroot/sites/export-products.strateg.ua/storage:ro
      - ../../.docker/dev/cron/crontabs:/etc/crontabs
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      dev-strateg-export-products-php-fpm:
        condition: service_started
      dev-strateg-export-products-postgresql:
        condition: service_healthy
    networks:
      - dev-strateg-export-products-net
      - buggregator-net

  dev-strateg-export-products-nginx:
    build:
      context: $PWD
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-nginx:1.0-alpine-slim
    container_name: dev-strateg-export-products-nginx
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.network=traefik-network"
      - "traefik.http.routers.dev-strateg-export-products-nginx.rule=Host(`dev.strateg-export-products.com`)"
      - "traefik.http.routers.dev-strateg-export-products-nginx.entrypoints=web"
      - "traefik.http.services.dev-strateg-export-products-nginx.loadbalancer.server.port=80"
      - "traefik.http.routers.dev-strateg-export-products-nginx.middlewares=global-ratelimit@file,global-inflight@file"
    volumes:
      - ../../app-code/app:/var/webroot/sites/export-products.strateg.ua/app:ro
      - ../../app-code/httpdocs:/var/webroot/sites/export-products.strateg.ua/httpdocs:ro
      - ../../app-code/storage:/var/webroot/sites/export-products.strateg.ua/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    tmpfs:
      - /tmp                    # Nginx temporary files
    depends_on:
      - dev-strateg-export-products-php-fpm
    networks:
      - traefik-network
      - dev-strateg-export-products-net

  dev-strateg-export-products-postgresql:
    build:
      context: $PWD
      dockerfile: .docker/dev/postgresql/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-strateg-export-products-postgresql:1.0-alpine
    container_name: dev-strateg-export-products-postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=$$POSTGRES_SIMPLE_USER --dbname=$$POSTGRES_DB" ]
      interval: 3s
      timeout: 3s
      retries: 1
    ports:
      - "3343:5432"
    restart: no
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../.db:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - dev-strateg-export-products-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  dev-strateg-export-products-net:
    name: dev-strateg-export-products-net
    driver: bridge
    external: true
  buggregator-net:
    name: buggregator-net
    driver: bridge
    external: true