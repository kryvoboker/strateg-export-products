worker_processes auto;

error_log /var/log/nginx/error.log error;

pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" ' '$status $body_bytes_sent "$http_referer" ' '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;

    keepalive_timeout 65;

    # Enable gzip
    gzip on;

    # Compression includes responses even if they are smaller than the specified size (in bytes)
    gzip_min_length 256;

    # Specify file types to compress
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/woff;

    # We do not compress answers for old versions IE
    gzip_disable "msie6";

    # Optimal compression settings
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;

    # Trust only Traefik IP/subnets (docker network)
    set_real_ip_from 172.18.0.0/16;   # Your docker/traefik
    real_ip_header X-Forwarded-For; # Traefik sets this header with the original client IP
    real_ip_recursive on; # Trust the X-Forwarded-For header from Traefik, which may contain multiple IPs. The last one is the original client.

    server {
        listen      80;
        listen      [::]:80;
        index       index.php;
        server_name localhost;
        root        /var/webroot/sites/export-products.strateg.ua/httpdocs;

        add_header X-Frame-Options           "SAMEORIGIN";
        add_header X-XSS-Protection          "1; mode=block";
        add_header Referrer-Policy           "no-referrer"                         always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Permissions-Policy        "interest-cohort=()"                  always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~* \.(?:avif|bmp|css|eot|gif|gz|ico|jpeg|jpg|js|json|map|midi|mid|mjs|pdf|png|ppt|rar|svg|tar|tgz|ttf|txt|wav|webmanifest|webp|woff2?|xls|zip)$ {
            try_files $uri =404;
            expires       max;
            log_not_found off;
        }

        location ~* \.(tpl|twig|ini|log|txt)$ {
            deny all;
        }

        # Livewire v4 serves JS/CSS via dynamic routes like /livewire-<hash>/...
        # This location must be handled by Laravel and not by the static *.js location.
        location ^~ /livewire- {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Keep backward compatibility for legacy Livewire paths.
        location ^~ /livewire/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /xhprof {
            return 301 /xhprof/xhprof_html/;
        }

        location ^~ /xhprof/ {
            root /var/webroot/sites/export-products.strateg.ua/;
            index index.php;
            try_files $uri $uri/ /xhprof/xhprof_html/index.php?$query_string;

            location ~ \.php$ {
                fastcgi_pass dev-strateg-export-products-php-fpm:9000;
                fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

                # Pass real client IP to PHP ($_SERVER['HTTP_X_REAL_IP'])
                fastcgi_param HTTP_X_REAL_IP       $remote_addr;
                fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;

                # Reuse the same FastCGI timeouts as the main PHP entrypoint.
                fastcgi_connect_timeout 120;
                fastcgi_send_timeout    120;
                fastcgi_read_timeout    180;

                include fastcgi_params;
            }
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass dev-strateg-export-products-php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

            # Pass real client IP to PHP ($_SERVER['HTTP_X_REAL_IP'])
            fastcgi_param HTTP_X_REAL_IP      $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;

            # FastCGI timeouts
            fastcgi_connect_timeout 120;
            fastcgi_send_timeout    120;
            fastcgi_read_timeout    180;

            include fastcgi_params;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        # This is a directive that sets the maximum file size that can be uploaded.
        client_max_body_size 55M;
        fastcgi_buffers      64 4K;
    }

    include /etc/nginx/conf.d/*.conf;
}