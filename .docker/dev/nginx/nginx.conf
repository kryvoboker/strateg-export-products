
user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log error;
error_log  /var/log/nginx/error.log notice;
error_log  /var/log/nginx/error.log info;
error_log  /var/log/nginx/error.log warn;
# error_log  /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;
#     access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Enable gzip
    gzip on;

    # Compression includes responses even if they are smaller than the specified size (in bytes)
    gzip_min_length 256;

    # Specify file types to compress
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/woff;

    # We do not compress answers for old versions IE
    gzip_disable "msie6";

    # Optimal compression settings
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    server {
        listen       80;
        index                     index.php index.html index.htm index.phtml;
        server_name  localhost;
        root /var/webroot/sites/export-products.strateg.ua/httpdocs;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.(gif|bmp|css|zip|tgz|gz|rar|bz2|doc|xls|exe|pdf|ppt|txt|tar|mid|midi|wav|rtf|js)$ {
            expires max;
            log_not_found off;
        }

        location ~* \.(tpl|twig|ini|log|txt)$ {
            deny all;
        }

        location ~ \.php$ {
            fastcgi_pass dev-strateg-export-products-php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
#             fastcgi_param HTTPS 'on';
            proxy_connect_timeout 120;
            proxy_send_timeout 120;
            proxy_read_timeout 180;

            include fastcgi_params;
        }

        location ~ /\.ht {
            deny  all;
        }

        # This is a directive that sets the maximum file size that can be uploaded.
        client_max_body_size 8M;
        fastcgi_buffers 64 4K;
    }

    include /etc/nginx/conf.d/*.conf;
}